<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Detective - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">Campus Detective</h1>
            <div class="nav-links">
                <a href="home.html" class="active">Home</a>
                <a href="report.html">Report Item</a>
                <a href="leaderboard.html">Leaderboard</a>
                <button id="logoutBtn" class="btn btn-logout">Logout</button>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <div class="welcome-section">
            <p class="tagline-large">"കുന്തം പോയാൽ കുടത്തിലും തപ്പണം"</p>
            <div id="welcomeMessage" class="welcome-message"></div>
        </div>

        <div class="feed-controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by item name...">
                <button id="searchBtn" class="btn btn-search">🔍 Search</button>
            </div>
            
            <div class="filter-buttons">
                <button class="btn filter-btn active" data-filter="all">All</button>
                <button class="btn filter-btn" data-filter="lost">Lost</button>
                <button class="btn filter-btn" data-filter="found">Found</button>
            </div>
        </div>

        <div id="itemsFeed" class="items-feed">
            <!-- Items will be loaded here -->
        </div>
    </main>

    <script src="js/home.js"></script>
</body>
</html>
