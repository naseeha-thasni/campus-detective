<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Detective  - Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <h1 class="logo"style="color: black;"> Campus Detective </h1>
            <p class="tagline" style="color: black;">"കുന്തം പോയാൽ കുടത്തിലും തപ്പണം"</p>
            
            <form id="signupForm" class="auth-form">
                <h2>Create an Account</h2>
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
                
                <div class="form-group">
                    <label for="campusId">Campus ID</label>
                    <input type="text" id="campusId" name="campusId" placeholder="Enter your campus ID" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Sign Up</button>
                
                <p class="auth-link">
                    Already have an account? <a href="index.html">Login</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const campusId = document.getElementById('campusId').value;
            
            // Get existing users
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Check if user already exists
            if (users.some(u => u.email === email)) {
                alert('User with this email already exists!');
                return;
            }
            
            // Create new user
            const newUser = {
                fullName,
                email,
                password,
                campusId,
                points: 0
            };
            
            // Add to users array
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            
            alert('Account created successfully! Please login.');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
